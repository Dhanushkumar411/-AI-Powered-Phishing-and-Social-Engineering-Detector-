<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishShield Security Incident Report</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-cyan: #06b6d4;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 40px 20px;
        }
        .report-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .report-title h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            color: #0f172a;
        }
        .report-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #64748b;
        }
        .verdict-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .verdict-box.critical { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .verdict-box.suspicious { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
        .verdict-box.safe { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .verdict-box h2 { margin: 0; font-size: 20px; }
        .risk-pill {
            font-size: 18px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 9999px;
            background: rgba(0,0,0,0.06);
            font-family: 'JetBrains Mono', monospace;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #334155;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 6px;
            margin-top: 30px;
            margin-bottom: 16px;
        }
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .score-item {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .score-item .label { font-size: 12px; color: #64748b; display: block; margin-bottom: 4px; }
        .score-item .val { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .findings-list, .rec-list {
            margin: 0;
            padding-left: 20px;
        }
        .findings-list li { margin-bottom: 10px; line-height: 1.5; }
        .rec-list li { margin-bottom: 8px; line-height: 1.5; }
        .message-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            color: #334155;
            max-height: 300px;
            overflow-y: auto;
        }
        .print-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        @media print {
            body { padding: 0; background: white; }
            .report-wrapper { border: none; box-shadow: none; padding: 0; }
            .print-btn { display: none; }
        }
    </style>
</head>
<body>
    <div class="report-wrapper">
        <div class="report-header">
            <div class="report-title">
                <h1>PhishShield Security Incident Report</h1>
                <div class="report-meta" id="reportMeta">Generated by Antigravity PhishShield Defense Engine</div>
            </div>
            <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
        </div>

        <div id="reportContainer">
            <p>Loading report data from session...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stored = sessionStorage.getItem('last_phish_report');
            const container = document.getElementById('reportContainer');
            const meta = document.getElementById('reportMeta');
            meta.innerText = `Generated: ${new Date().toUTCString()} | Engine: TF-IDF + LogisticRegression + Heuristics`;

            if (!stored) {
                container.innerHTML = '<p>No analysis data found. Please run an analysis in the main console and click "Export Report".</p>';
                return;
            }

            const data = JSON.parse(stored);
            const verdictClass = data.overall_verdict === 'CRITICAL_PHISHING' ? 'critical' : (data.overall_verdict === 'SUSPICIOUS' ? 'suspicious' : 'safe');

            let warningsHtml = data.warning_signs.map(w => `
                <li><strong>[${w.severity}] ${w.title}:</strong> ${w.description}</li>
            `).join('');

            let recsHtml = data.recommendations.map(r => `<li>${r}</li>`).join('');

            container.innerHTML = `
                <div class="verdict-box ${verdictClass}">
                    <div>
                        <h2>Verdict: ${data.verdict_badge}</h2>
                        <span style="font-size:14px;">Confidence Assessment: ${data.overall_verdict}</span>
                    </div>
                    <div class="risk-pill">Composite Threat: ${data.risk_score}%</div>
                </div>

                <div class="section-title">Threat Modality Breakdown</div>
                <div class="scores-grid">
                    <div class="score-item"><span class="label">ML Linguistic Score</span><span class="val">${data.scores_breakdown.ml_nlp_score}%</span></div>
                    <div class="score-item"><span class="label">URL & Domain Threat</span><span class="val">${data.scores_breakdown.url_threat_score}%</span></div>
                    <div class="score-item"><span class="label">Social Engineering</span><span class="val">${data.scores_breakdown.social_engineering_score}%</span></div>
                    <div class="score-item"><span class="label">Header Spoofing</span><span class="val">${data.scores_breakdown.header_spoof_score}%</span></div>
                </div>

                <div class="section-title">Warning Signs & Evidence</div>
                <ul class="findings-list">
                    ${warningsHtml || '<li>No suspicious red flags detected.</li>'}
                </ul>

                <div class="section-title">Defensive Action Items</div>
                <ul class="rec-list">
                    ${recsHtml}
                </ul>

                <div class="section-title">Original Analyzed Content</div>
                <div class="message-box">${data.input_summary.subject ? 'Subject: ' + data.input_summary.subject + '\n\n' : ''}${data.nlp_analysis.text_stats ? 'Analyzed text length: ' + data.nlp_analysis.text_stats.char_count + ' characters, ' + data.nlp_analysis.text_stats.word_count + ' words.' : ''}</div>
            `;
        });
    </script>
</body>
</html>
